  # Stały pasek nad stronami. Kliknięcia przechodzą do widgetów pod spodem.
  top_layer:
    widgets:
      # Przezroczysta ramka na wspólnej warstwie obejmuje wszystkie ekrany.
      # Jej szerokość zmienia automatyzacja co 500 ms tylko podczas potwierdzonej
      # i aktualnej regeneracji; kliknięcia przechodzą do elementów pod spodem.
      - obj:
          id: regen_alert_frame
          align: CENTER
          width: 100%
          height: 100%
          radius: 0
          bg_opa: transp
          border_color: 0xFF253A
          border_width: 0
          border_side: [TOP, BOTTOM, LEFT, RIGHT]
          clickable: false
      - obj:
          id: dpf_status_bar
          align: TOP_MID
          width: 100%
          height: 28
          radius: 0
          border_width: 0
          bg_color: 0x151E2B
          clickable: false
          widgets:
            - label:
                id: global_regen_label
                align: LEFT_MID
                x: 12
                text: "WYPALANIE: BRAK ODCZYTU"
                text_font: montserrat_14
                text_color: 0xFFB547
