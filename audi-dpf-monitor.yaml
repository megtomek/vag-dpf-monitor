            width: 210
            height: 44
            text: "DEMO: WYŁ. — WŁĄCZ"
            text_align: CENTER
            pad_top: 13
            text_font: ui_small
            text_color: 0xFFFFFF
            bg_color: 0x354254
            bg_opa: cover
            radius: 9
            border_width: 1
            border_color: 0x60758C
            border_opa: cover
            clickable: true
            on_click:
              then:
                - lambda: |-
                    if (!id(demo_mode)) {
                      // DEMO is also a strict CAN-silent mode: cancel the current
                      // request and flush any frame still queued in the TWAI driver.
                      uds_manager.cancel_pending_obd_request();
                      id(obd_can).clear_transmit_queue();
                      id(demo_mode) = true;
                      id(demo_start_ms) = millis();
                    } else {
                      id(demo_mode) = false;
                      id(soot_calculated_available).publish_state(false);
                      id(soot_measured_available).publish_state(false);
                      id(distance_since_regen_available).publish_state(false);
                      id(temp_before_dpf_available).publish_state(false);
                      id(temp_before_turbo_available).publish_state(false);
                      id(regen_data_available).publish_state(false);
                      id(dpf_regen).publish_state(false);
                      id(dpf_regen_source_text).publish_state("unavailable");
                      id(obd_dpf_regen_pid_support_text).publish_state("unknown");
                    }
                - if:
                    condition:
                      lambda: return id(demo_mode);
                    then:
                      - lvgl.label.update:
                          id: demo_toggle_label
                          text: "DEMO: AKTYWNE — STOP"
                          text_color: 0xFFFFFF
                      - lvgl.widget.update:
                          id: demo_toggle_label
                          bg_color: 0xA85212
                          border_color: 0xFFB547
                    else:
                      - lvgl.label.update:
                          id: demo_toggle_label
                          text: "DEMO: WYŁ. — WŁĄCZ"
                          text_color: 0xFFFFFF
                      - lvgl.widget.update:
