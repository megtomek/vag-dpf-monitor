    mac_address:
      name: "MAC Wi-Fi urządzenia"
      web_server:
        sorting_group_id: dpf_web_network
        sorting_weight: 40
  # Pokazuje, z którego zweryfikowanego źródła pochodzi bieżący stan regeneracji.
  - platform: template
    id: dpf_regen_source_text
    name: "Źródło statusu regeneracji"
    update_interval: never
    web_server:
      sorting_group_id: dpf_web_status
      sorting_weight: 60

# Flaga aktywnej regeneracji oraz zmiana tekstu/koloru jej wskaźnika.
binary_sensor:
  # Łącze OBD-II oznacza świeżą, poprawną odpowiedź na co najmniej jeden PID.
  - platform: template
    id: obd_link_available
    internal: true

  - platform: template
    id: dpf_regen
    name: "DPF Regeneration Active"
    # Nie publikuj placeholdera UDS jako wiarygodnego stanu ECU.
    # Zewnętrzny odczyt można włączyć po potwierdzeniu DID-u i dekodera profilu.
    internal: true
    on_state:
      then:
        - lambda: |-
            const std::string state = id(demo_mode)
                ? regen_status_name(static_cast<RegenStatus>(id(demo_regen_state)))
                : uds_manager.regen_operating_state(${regen_stale_timeout_ms});
            id(dpf_regen_status_text).publish_state(state);

  # Sama odpowiedź ECU nie wystarcza: status musi być aktualny, a PID/DID jawnie
  # obsługiwany. Bez tego ekran pokazuje brak danych i nie wyświetla alarmu.
  - platform: template
    id: regen_data_available
    name: "Dostępność statusu regeneracji"
    entity_category: diagnostic
    web_server:
      sorting_group_id: dpf_web_diagnostics
      sorting_weight: 40
    on_state:
      then:
        - lambda: |-
            const std::string state = id(demo_mode)
                ? regen_status_name(static_cast<RegenStatus>(id(demo_regen_state)))
                : uds_manager.regen_operating_state(${regen_stale_timeout_ms});
            id(dpf_regen_status_text).publish_state(state);

  # Każda wartość ma oddzielny timeout. Świeża odpowiedź z innego DID-u nie
  # może pozostawić starej liczby na ekranie jako pozornie aktualnej.
  - platform: template
    id: soot_calculated_available
    internal: true
    on_state:
      then:
        - if:
            condition:
              lambda: return !x;
            then:
              - lvgl.bar.update:
                  id: soot_progress_bar
                  value: 0
              - lvgl.label.update:
                  id: soot_value_label
                  text: "-- g"

  - platform: template
    id: soot_measured_available
    internal: true
    on_state:
      then:
        - if:
            condition:
              lambda: return !x;
            then:
              - lvgl.label.update:
                  id: soot_measured_label
                  text: "-- g"

  - platform: template
    id: distance_since_regen_available
    internal: true
    on_state:
      then:
        - if:
            condition:
              lambda: return !x;
            then:
              - lvgl.label.update:
                  id: distance_value_label
                  text: "-- km"

  - platform: template
    id: temp_before_dpf_available
    internal: true
    on_state:
      then:
        - if:
            condition:
              lambda: return !x;
            then:
              - lvgl.bar.update:
                  id: dpf_temp_bar
                  value: 0
              - lvgl.label.update:
                  id: dpf_temp_label
                  text: "-- °C"

  - platform: template
    id: temp_before_turbo_available
    internal: true
    on_state:
      then:
        - if:
            condition:
              lambda: return !x;
            then:
              - lvgl.bar.update:
                  id: turbo_temp_bar
                  value: 0
              - lvgl.label.update:
                  id: turbo_temp_label
                  text: "-- °C"


# --- Kontroler dotyku FT3168; orientację obsługuje konfiguracja LVGL. ---
touchscreen:
  - platform: ft3168
    id: my_touch
    display: amoled
    address: 0x38
    # Polling 100 Hz zmniejsza ryzyko pominięcia krótkiego raportu dotyku.
    update_interval: 10ms
    # Każdy ręczny dotyk zatrzymuje automatyczne przewijanie. Kliknięcie
    # kafelka AUTO może je ponownie włączyć w jego własnym on_click.
    on_touch:
      then:
        - lambda: id(auto_view_enabled) = false;

