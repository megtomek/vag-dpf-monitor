# --- Interfejs LVGL: poziomy ekran 456 × 280 px. ---
lvgl:
  displays:
    - amoled
  touchscreens:
    - my_touch
  # Opcjonalny pomiar obejmuje render LVGL i zakończenie flush na wyświetlacz.
  # Jest wyłączony w normalnym firmware; włącz ui_perf_metrics_enabled tylko
  # dla testu i przewijaj strony, aby zebrać próbki rzeczywistych odrysowań.
  on_draw_start:
    then:
      - lambda: |-
          if (!${ui_perf_metrics_enabled}) return;
          id(ui_draw_started_ms) = millis();
          id(ui_draw_in_progress) = true;
  on_draw_end:
    then:
      - lambda: |-
          if (!${ui_perf_metrics_enabled} || !id(ui_draw_in_progress)) return;
          const uint32_t elapsed_ms = millis() - id(ui_draw_started_ms);
          id(ui_draw_in_progress) = false;
          id(ui_draw_total_ms) += elapsed_ms;
          if (elapsed_ms > id(ui_draw_max_ms)) {
            id(ui_draw_max_ms) = static_cast<uint16_t>(elapsed_ms);
          }
          if (id(ui_draw_samples) < 65535U) ++id(ui_draw_samples);
  # ESPHome zaleca 12% przy dostępnej PSRAM: mały bufor rysowania może wtedy
  # zostać przydzielony w szybszej pamięci wewnętrznej. Obrót programowy tworzy
  # dodatkowy bufor; obserwuj logi heap/PSRAM po zmianie tej wartości.
  buffer_size: 25%
  # Obrót ekranu i współrzędnych dotyku obsługuje LVGL.
  rotation: 90
  # Duża domyślna czcionka; poszczególne elementy mogą używać ról z font:.
  text_font: ui_label
  text_color: 0xF2F5F8
  bg_color: 0x0B1018
  border_width: 0
  pages:
    - id: main_page
      bg_color: 0x0B1018
      # Ekran główny: duża masa sadzy, prosty pasek zakresu i status regeneracji.
      widgets:
        - label:
            id: demo_badge_main
            align: TOP_LEFT
            x: 12
            y: 34
            width: 76
            height: 22
            text: "DEMO"
            text_align: CENTER
            text_font: ui_small
            text_color: 0xFFB547
