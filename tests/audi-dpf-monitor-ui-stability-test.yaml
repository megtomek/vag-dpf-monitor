# --- Interfejs LVGL: poziomy ekran 456 × 280 px. ---
lvgl:
  displays:
    - amoled
  touchscreens:
    - my_touch
  # Ćwierć ekranu na bufor renderowania. Przy obrocie programowym LVGL
  # używa drugiego bufora, więc ustawienie 25% ogranicza zużycie PSRAM
  # z około 512 KB do około 128 KB i pozwala sprawdzić stabilność obrazu.
  buffer_size: 25%
  # Obrót ekranu i współrzędnych dotyku obsługuje LVGL.
  rotation: 90
  # Duża domyślna czcionka; poszczególne elementy mogą używać ról z font:.
