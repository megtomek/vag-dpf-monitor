substitutions:
  # Nazwa urządzenia w ESPHome oraz nazwa widoczna w Home Assistant.
  device_name: audi-dpf-ui-stability-test
  friendly_name: VAG DPF UI Stability Test
  # Zachowany na czas projektowania UI; będzie użyty ponownie po włączeniu CAN.
  data_stale_timeout_ms: "15000"
  # GPIO46 wygasiło ekran; przywrócono sprawdzone połączenie GPIO9.
  display_cs_pin: GPIO9
  # Set false only for USB bench diagnostics; normal vehicle firmware uses true.
  can_bus_enabled: "false"
  # Rozmiary czcionek UI w pikselach. Czcionka nawigacji ma osobną wartość,
  # aby można ją było powiększyć bez zmiany tekstów na pozostałych ekranach.
  ui_font_small: "18"
  ui_font_nav: "20"
  ui_font_label: "22"
  ui_font_value: "38"
  ui_font_hero: "48"

# Wybrany profil jest zapamiętywany, ale jego wybór nie włącza niezweryfikowanych DID-ów.
globals:
  - id: ecu_profile_selection
    type: int
    restore_value: yes
    initial_value: '0'  # 0 = Auto / standard OBD-II, 1 = kandydat CJCD.
  # Test UI: DEMO wymuszone, aby pełny ekran aktualizował się bez ECU.
  - id: demo_mode
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: demo_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

# Local components: FT3168 touchscreen and TWAI CAN driver with bus recovery.
external_components:
  - source:
      type: local
      path: ../components
    components: [ft3168, esp32_can_recover]

# Read-only OBD-II over the external SN65HVD230 transceiver.
# Mode 01/09 requests only read vehicle data; vehicle-specific UDS DIDs remain disabled.
canbus:
  - platform: esp32_can_recover
    id: obd_can
    enabled: ${can_bus_enabled}
    # GPIO1 w prespecie ekranu jest wyjściem zasilania AMOLED; CAN używa
    # wolnych pinów GPIO5/6 wyprowadzonych na listwę. Nie wkładaj karty TF:
    # te piny są też doprowadzone do nieużywanego gniazda karty SD.
    tx_pin: GPIO5
    rx_pin: GPIO6
    can_id: 0x7E0
    bit_rate: 500kbps
    mode: NORMAL
    rx_queue_len: 16
    # OBD wysyła pojedyncze żądania sekwencyjnie. Jedno miejsce wystarcza
    # i nie pozwala gromadzić nieaktualnych żądań przy braku odpowiedzi.
    tx_queue_len: 1
    on_frame:
      # Odbieraj ruch magistrali tylko do wykrycia aktywnego auta; żądania OBD
      # ruszają po wykryciu ramek i pauzują po 2 s ciszy. Dane ECU bierzemy z 0x7E8.
      - can_id: 0
        can_id_mask: 0
        use_extended_id: false
        then:
          - lambda: |-
              if (!id(demo_mode) && ${can_bus_enabled}) {
                uds_manager.notify_can_activity();
                if (can_id == 0x7E8) uds_manager.handle_rx(x);
              }

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    - ../uds_audi.h
  on_boot:
    then:
      - lambda: |-
          uds_manager.configure(
            id(obd_can),  // Standardowe zapytania OBD-II; niezweryfikowane DID-y UDS są wyłączone.
            id(soot_calculated),
            id(soot_measured),
            id(distance_since_regen),
            id(temp_before_turbo),
            id(temp_before_dpf),
            id(dpf_regen),
            id(obd_engine_rpm),
            id(obd_coolant_temperature),
            id(obd_dpf_delta_pressure),
            id(obd_dpf_inlet_temperature),
            id(obd_intake_manifold_pressure),
            id(obd_barometric_pressure),
            id(obd_estimated_boost_pressure),
            id(obd_ecu_name),
            id(obd_calibration_ids),
            0x7E0,
            ${data_stale_timeout_ms}
          );
          // Profil można wybrać offline. CJCD pozostaje kandydatem dopóki mapa DID nie zostanie zweryfikowana.
          if (id(ecu_profile_selection) != 1) id(ecu_profile_selection) = 0;
          id(ecu_profile_selection_text).publish_state(
            id(ecu_profile_selection) == 1 ? "CJCD / 03L906018SJ (KANDYDAT)" : "AUTO / STANDARD OBD-II");
          // Publikuj stan początkowy jako nieznany; nie traktuj go jako braku regeneracji.
          id(dpf_regen_status_text).publish_state("unavailable");
          id(dpf_regen_source_text).publish_state("unavailable");
          id(obd_dpf_regen_pid_support_text).publish_state("unknown");

# Płytka: ESP32-S3 z 16 MB Flash i 8 MB PSRAM.
esp32:
  board: esp32-s3-devkitc1-n16r8
  # Waveshare ESP32-S3-Touch-AMOLED-1.64 has 16 MB Flash; do not rely on
  # ESPHome's generic 4 MB default for this board definition.
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

# Logi diagnostyczne są widoczne w ESPHome podczas uruchomienia.
logger:
  level: INFO
  logs:
    ft3168.touchscreen: WARN

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

# Dane Wi-Fi trzymaj w secrets.yaml, nie wpisuj ich tutaj jawnie.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  enable_on_boot: false
  reboot_timeout: 0s

# Magistrala Quad SPI dla wyświetlacza AMOLED.
spi:
  - id: display_spi
    type: quad
    clk_pin: GPIO10
    data_pins: [GPIO11, GPIO12, GPIO13, GPIO14]

# Magistrala I2C dla kontrolera dotyku FT3168.
i2c:
  sda: GPIO47
  scl: GPIO48
  # Płytka ma także IMU na tej samej magistrali. Nie skanuj go: FT3168 może
  # stracić łączność po dostępie do innego urządzenia w trybie czuwania.
  scan: false
  # Producent używa 300 kHz dla FT3168; na tym etapie odczytujemy tylko dotyk.
  frequency: 300kHz

# --- Wyświetlacz: panel ma natywnie układ pionowy, ale pracuje poziomo. ---
display:
  - platform: mipi_spi
    id: amoled
    # Preset Waveshare dla tej płytki dodaje wymagany offset kolumn CO5300: 20 px.
    model: WAVESHARE-ESP32-S3-TOUCH-AMOLED-1.64
    bus_mode: quad
    spi_id: display_spi
    # Offset X=20 px i rozdzielczość 280 × 456 pochodzą z presetu płytki.
    # Dla przyjętej roboczo rewizji V1 skrypt podstawia GPIO9.
    cs_pin: ${display_cs_pin}
    reset_pin: GPIO21
    # Jasność AMOLED: zakres 0–255.
    brightness: 220
    color_order: rgb
    spi_mode: mode0
    # Niższy zegar QSPI (zamiast domyślnych 10 MHz) pomaga sprawdzić i
    # ograniczyć artefakty obrazu przy niestabilnym połączeniu panelu.
    data_rate: 5MHz
    auto_clear_enabled: false
    update_interval: never

# Odpytuj standardowe PID-y OBD-II. Demo odcina pętlę diagnostyczną, by dane
# symulowane nigdy nie mieszały się z odpowiedziami samochodu.
interval:
  - interval: 50ms
    then:
      - lambda: |-
          if (!id(demo_mode) && ${can_bus_enabled}) uds_manager.loop();

  # Odświeżanie prezentacji i znaczników świeżości; ramki odpytuje wyłącznie
  # osobna pętla diagnostyczna, z wyłączeniem trybu DEMO.
  - interval: 1s
    then:
      - lambda: |-
          if (id(demo_mode)) {
            // Jednorazowy 120-sekundowy pokaz: 90 s regeneracji, potem 30 s chłodzenia.
            // Wartości są fikcyjne i widocznie oznaczone etykietą DEMO na każdej karcie.
            const uint32_t elapsed_s = (millis() - id(demo_start_ms)) / 1000;
            const bool regenerating = elapsed_s < 90;
            const float soot_calc = regenerating
                ? 23.6f - (17.2f * std::min<uint32_t>(elapsed_s, 89) / 89.0f)
                : 6.4f;
            const float soot_meas = regenerating
                ? 19.4f - (18.2f * std::min<uint32_t>(elapsed_s, 89) / 89.0f)
                : 1.2f;
            float dpf_temp;
            float turbo_temp;
            if (regenerating) {
              dpf_temp = 610.0f + static_cast<float>(elapsed_s % 15) * 2.0f;
              turbo_temp = 480.0f + static_cast<float>(elapsed_s % 10) * 3.0f;
            } else {
              const uint32_t cool_s = std::min<uint32_t>(elapsed_s - 90, 30);
              dpf_temp = std::max(180.0f, 638.0f - static_cast<float>(cool_s) * 15.0f);
              turbo_temp = std::max(160.0f, 507.0f - static_cast<float>(cool_s) * 11.0f);
            }

            id(soot_calculated).publish_state(soot_calc);
            id(soot_measured).publish_state(soot_meas);
            id(distance_since_regen).publish_state(regenerating ? 186.0f : 0.0f);
            id(temp_before_dpf).publish_state(dpf_temp);
            id(temp_before_turbo).publish_state(turbo_temp);
            id(obd_dpf_inlet_temperature).publish_state(dpf_temp);
            id(obd_engine_rpm).publish_state(regenerating ? 2200.0f : 850.0f);
            id(obd_coolant_temperature).publish_state(92.0f);
            id(soot_calculated_available).publish_state(true);
            id(soot_measured_available).publish_state(true);
            id(distance_since_regen_available).publish_state(true);
            id(temp_before_dpf_available).publish_state(true);
            id(temp_before_turbo_available).publish_state(true);
            id(regen_data_available).publish_state(true);
            id(dpf_regen).publish_state(regenerating);
            id(obd_link_available).publish_state(false);
            if (id(dpf_regen_source_text).state != "DEMO — DANE SYMULOWANE") {
              id(dpf_regen_source_text).publish_state("DEMO — DANE SYMULOWANE");
            }
            if (id(obd_dpf_regen_pid_support_text).state != "demo") {
              id(obd_dpf_regen_pid_support_text).publish_state("demo");
            }
          } else {
            // Zwykły tryb nadal korzysta wyłącznie ze świeżych danych sterownika.
            id(soot_calculated_available).publish_state(uds_manager.is_did_fresh(0xF402, ${data_stale_timeout_ms}));
            id(soot_measured_available).publish_state(uds_manager.is_did_fresh(0xF403, ${data_stale_timeout_ms}));
            id(distance_since_regen_available).publish_state(uds_manager.is_did_fresh(0xF404, ${data_stale_timeout_ms}));
            const bool dpf_temp_uds_fresh = uds_manager.is_did_fresh(0xF405, ${data_stale_timeout_ms});
            const bool dpf_temp_obd_fresh = uds_manager.is_obd_pid_fresh(0x7C, ${data_stale_timeout_ms}) && uds_manager.is_obd_pid_supported(0x7C);
            id(temp_before_dpf_available).publish_state(dpf_temp_uds_fresh || dpf_temp_obd_fresh);
            id(temp_before_turbo_available).publish_state(uds_manager.is_did_fresh(0xF406, ${data_stale_timeout_ms}));
            id(regen_data_available).publish_state(uds_manager.has_fresh_regen_data(${data_stale_timeout_ms}));
            const std::string regen_source = uds_manager.regen_data_source(${data_stale_timeout_ms});
            if (id(dpf_regen_source_text).state != regen_source) {
              id(dpf_regen_source_text).publish_state(regen_source);
            }
            const std::string regen_pid_support = !uds_manager.is_obd_pid_support_known(0x8B)
                ? "unknown"
                : (uds_manager.is_obd_pid_supported(0x8B) ? "supported" : "unsupported");
            if (id(obd_dpf_regen_pid_support_text).state != regen_pid_support) {
              id(obd_dpf_regen_pid_support_text).publish_state(regen_pid_support);
            }
            id(obd_link_available).publish_state(uds_manager.has_obd_link(${data_stale_timeout_ms}));
            if (!dpf_temp_uds_fresh && dpf_temp_obd_fresh) {
              const float dpf_temp = id(obd_dpf_inlet_temperature).state;
              lv_bar_set_value(id(dpf_temp_bar), static_cast<int>(std::clamp(dpf_temp, 0.0f, 700.0f)), LV_ANIM_OFF);
              lv_label_set_text(id(dpf_temp_label), esphome::str_sprintf("%.0f °C", dpf_temp).c_str());
            } else if (!dpf_temp_uds_fresh && !dpf_temp_obd_fresh) {
              lv_bar_set_value(id(dpf_temp_bar), 0, LV_ANIM_OFF);
              lv_label_set_text(id(dpf_temp_label), "-- °C");
            }
          }
      - if:
          condition:
            lambda: return id(demo_mode);
          then:
            - lvgl.widget.show: demo_badge_main
            - lvgl.widget.show: demo_badge_temp
            - lvgl.widget.show: demo_badge_filter
            - lvgl.widget.show: demo_badge_ecu
          else:
            - lvgl.widget.hide: demo_badge_main
            - lvgl.widget.hide: demo_badge_temp
            - lvgl.widget.hide: demo_badge_filter
            - lvgl.widget.hide: demo_badge_ecu
  # Alert jest osobnym widgetem każdej strony, aby uniknąć artefaktu zielonego
  # pasa obserwowanego przy użyciu statusu na przezroczystej warstwie LVGL.
  # Na aktualnie otwartej stronie alert pojawi się tylko przy świeżej regeneracji.
  - interval: 500ms
    then:
      # Ramka i migająca belka używają jednego źródła prawdy w tym samym
      # cyklu. Zapobiega to pozostaniu napisu „DPF OK” podczas alarmu.
      - lvgl.label.update:
          id: regen_status_label
          text: !lambda |-
            // Regeneracja ma pierwszeństwo przed tekstem spoczynkowym.
            // DPF OK pokazujemy wyłącznie przy świeżym, jawnym stanie „nieaktywna”.
            if (id(regen_data_available).state && id(dpf_regen).state) return std::string("NIE GAŚ!");
            if (!id(regen_data_available).state) return std::string("BRAK DANYCH");
            return std::string("DPF OK");
          text_color: !lambda |-
            if (!id(regen_data_available).state) return lv_color_hex(0xFFB547);
            return id(dpf_regen).state ? lv_color_hex(0xF2F5F8) : lv_color_hex(0x32D6C5);
      - if:
          condition:
            lambda: return id(regen_data_available).state && id(dpf_regen).state;
          then:
            - lvgl.widget.show: regen_alert_main
            - lvgl.widget.show: regen_alert_temp
            - lvgl.widget.show: regen_alert_filter
            - lvgl.widget.show: regen_alert_ecu
            - lvgl.widget.update:
                id: regen_alert_main
                bg_color: !lambda |-
                  return ((millis() / 500) % 2 == 0)
                      ? lv_color_hex(0xC6283D)
                      : lv_color_hex(0xFF9F1C);
            - lvgl.widget.update:
                id: regen_alert_temp
                bg_color: !lambda |-
                  return ((millis() / 500) % 2 == 0)
                      ? lv_color_hex(0xC6283D)
                      : lv_color_hex(0xFF9F1C);
            - lvgl.widget.update:
                id: regen_alert_filter
                bg_color: !lambda |-
                  return ((millis() / 500) % 2 == 0)
                      ? lv_color_hex(0xC6283D)
                      : lv_color_hex(0xFF9F1C);
            - lvgl.widget.update:
                id: regen_alert_ecu
                bg_color: !lambda |-
                  return ((millis() / 500) % 2 == 0)
                      ? lv_color_hex(0xC6283D)
                      : lv_color_hex(0xFF9F1C);
          else:
            - lvgl.widget.hide: regen_alert_main
            - lvgl.widget.hide: regen_alert_temp
            - lvgl.widget.hide: regen_alert_filter
            - lvgl.widget.hide: regen_alert_ecu

# --- Encje ESPHome z wartościami odczytanymi przez uds_audi.h. ---
sensor:
  # Dane OBD publikowane przez aktywny, tylko-odczytowy menedżer diagnostyczny.
  - platform: template
    id: obd_engine_rpm
    name: "OBD Engine RPM"
    unit_of_measurement: "rpm"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: obd_coolant_temperature
    name: "OBD Coolant Temperature"
    unit_of_measurement: "°C"
    accuracy_decimals: 0
    update_interval: never

  # Standardowy PID 01 7A: różnica ciśnień DPF (kPa), jeśli pole jest wspierane.
  - platform: template
    id: obd_dpf_delta_pressure
    name: "OBD DPF Differential Pressure"
    unit_of_measurement: "kPa"
    accuracy_decimals: 2
    update_interval: never

  # Standardowy PID 01 7C: temperatura wlotowa DPF Bank 1, jeśli wspierana.
  - platform: template
    id: obd_dpf_inlet_temperature
    name: "OBD DPF Inlet Temperature"
    unit_of_measurement: "°C"
    accuracy_decimals: 0
    update_interval: never

  # Standardowy PID 01 0B: bezwzględne ciśnienie w kolektorze dolotowym.
  # To wartość MAP (zawiera ciśnienie atmosferyczne), a nie bezpośredni pomiar
  # względnego doładowania turbosprężarki.
  - platform: template
    id: obd_intake_manifold_pressure
    name: "OBD Intake Manifold Absolute Pressure"
    unit_of_measurement: "kPa"
    accuracy_decimals: 0
    update_interval: never

  # Standardowy PID 01 33: ciśnienie barometryczne bezwzględne.
  - platform: template
    id: obd_barometric_pressure
    name: "OBD Barometric Pressure"
    unit_of_measurement: "kPa"
    accuracy_decimals: 0
    update_interval: never

  # MAP minus BARO; szacunkowe ciśnienie względne w kolektorze dolotowym.
  - platform: template
    id: obd_estimated_boost_pressure
    name: "OBD Estimated Intake Gauge Pressure"
    unit_of_measurement: "kPa"
    accuracy_decimals: 0
    update_interval: never

  # Obliczona masa sadzy. Zakres paska 0–40 g jest wyłącznie wizualny, a nie
  # potwierdzonym progiem regeneracji ani limitem dla konkretnego sterownika.
  - platform: template
    id: soot_calculated
    name: "DPF Calculated Soot Mass"
    unit_of_measurement: "g"
    accuracy_decimals: 1
    update_interval: never
    on_value:
      then:
        - lvgl.bar.update:
            id: soot_progress_bar
            value: !lambda |-
              if (x < 0.0f) return 0;
              // Ograniczamy tylko wskaźnik; etykieta zachowuje surowy odczyt.
              if (x > 40.0f) return 40;
              return static_cast<int>(x);
        - lvgl.label.update:
            id: soot_value_label
            text: !lambda |-
              return esphome::str_sprintf("%.1f g", x);

  # Zmierzona masa sadzy; liczba znika z UI po utracie świeżości.
  - platform: template
    id: soot_measured
    name: "DPF Measured Soot Mass"
    unit_of_measurement: "g"
    accuracy_decimals: 1
    update_interval: never
    on_value:
      then:
        - lvgl.label.update:
            id: soot_measured_label
            text: !lambda |-
              return esphome::str_sprintf("%.1f g", x);

  # Dystans przejechany od ostatniej regeneracji DPF.
  - platform: template
    id: distance_since_regen
    name: "DPF Distance Since Regeneration"
    unit_of_measurement: "km"
    accuracy_decimals: 0
    update_interval: never
    on_value:
      then:
        - lvgl.label.update:
            id: distance_value_label
            text: !lambda |-
              return esphome::str_sprintf("%.0f km", x);

  # Temperatura spalin przed DPF. Limit tutaj musi odpowiadać dpf_temp_bar.max_value.
  - platform: template
    id: temp_before_dpf
    name: "Exhaust Temperature Before DPF"
    unit_of_measurement: "°C"
    accuracy_decimals: 0
    update_interval: never
    on_value:
      then:
        - lvgl.bar.update:
            id: dpf_temp_bar
            value: !lambda |-
              if (x < 0.0f) return 0;
              if (x > 700.0f) return 700;
              return static_cast<int>(x);
        - lvgl.label.update:
            id: dpf_temp_label
            text: !lambda |-
              return esphome::str_sprintf("%.0f °C", x);

  # Temperatura spalin przed turbosprężarką. Limit musi odpowiadać turbo_temp_bar.max_value.
  - platform: template
    id: temp_before_turbo
    name: "Exhaust Temperature Before Turbo"
    unit_of_measurement: "°C"
    accuracy_decimals: 0
    update_interval: never
    on_value:
      then:
        - lvgl.bar.update:
            id: turbo_temp_bar
            value: !lambda |-
              if (x < 0.0f) return 0;
              if (x > 800.0f) return 800;
              return static_cast<int>(x);
        - lvgl.label.update:
            id: turbo_temp_label
            text: !lambda |-
              return esphome::str_sprintf("%.0f °C", x);

# Identyfikacja sterownika przez standardowy OBD Service 09 / InfoType 0A.
# Pole jest opcjonalne; gdy ECU go nie udostępnia, encja pozostaje pusta.
text_sensor:
  - platform: template
    id: obd_ecu_name
    name: "OBD ECU Name"
    update_interval: never
    on_value:
      then:
        - lvgl.label.update:
            id: ecu_name_label
            text: !lambda |-
              if (x.empty()) return std::string("ECU: brak odczytu");
              return std::string("ECU: ") + x.substr(0, 36);
  - platform: template
    id: obd_calibration_ids
    name: "OBD Calibration IDs"
    update_interval: never
    on_value:
      then:
        - lvgl.label.update:
            id: ecu_calid_label
            text: !lambda |-
              if (x.empty()) return std::string("CALID: brak odczytu");
              return std::string("CALID: ") + x.substr(0, 38);
  - platform: template
    id: ecu_profile_selection_text
    name: "Selected ECU Profile"
    entity_category: config
    update_interval: never
    on_value:
      then:
        - lvgl.label.update:
            id: ecu_profile_selected_label
            text: !lambda return std::string(x);
        - lvgl.widget.update:
            id: ecu_profile_auto_option
            bg_color: !lambda |-
              return id(ecu_profile_selection) == 0 ? lv_color_hex(0x123B46) : lv_color_hex(0x151E2B);
        - lvgl.widget.update:
            id: ecu_profile_cjcd_option
            bg_color: !lambda |-
              return id(ecu_profile_selection) == 1 ? lv_color_hex(0x123B46) : lv_color_hex(0x151E2B);
  # Trójstanowy status do automatyzacji Home Assistant. "unavailable" oznacza,
  # że ECU nie potwierdziło obsługi PID-u albo dane utraciły świeżość.
  - platform: template
    id: dpf_regen_status_text
    name: "DPF Regeneration Status"
    update_interval: never
  # Ułatwia rozróżnienie braku odpowiedzi PID 0x8B od jawnej informacji,
  # że sterownik nie obsługuje pola statusu regeneracji.
  - platform: template
    id: obd_dpf_regen_pid_support_text
    name: "OBD DPF Regen PID 0x8B Support"
    update_interval: never
  # Pokazuje, z którego zweryfikowanego źródła pochodzi bieżący stan regeneracji.
  - platform: template
    id: dpf_regen_source_text
    name: "DPF Regeneration Data Source"
    update_interval: never

# Flaga aktywnej regeneracji oraz zmiana tekstu/koloru jej wskaźnika.
binary_sensor:
  # Łącze OBD-II oznacza świeżą, poprawną odpowiedź na co najmniej jeden PID.
  - platform: template
    id: obd_link_available
    internal: true

  - platform: template
    id: dpf_regen
    name: "DPF Regeneration Active"
    # Do not expose an unverified placeholder as a false/negative reading in Home Assistant.
    # Remove `internal` only after this ECU profile's regeneration DID and decoder are validated.
    internal: true
    on_state:
      then:
        - lambda: |-
            id(dpf_regen_status_text).publish_state(
                !id(regen_data_available).state ? "unavailable" : (x ? "active" : "inactive"));

  # Sama odpowiedź ECU nie wystarcza: status musi być aktualny, a PID/DID jawnie
  # obsługiwany. Bez tego ekran pokazuje brak danych i nie wyświetla alarmu.
  - platform: template
    id: regen_data_available
    name: "DPF Regeneration Status Available"
    entity_category: diagnostic
    on_state:
      then:
        - lambda: |-
            id(dpf_regen_status_text).publish_state(
                !x ? "unavailable" : (id(dpf_regen).state ? "active" : "inactive"));

  # Każda wartość ma oddzielny timeout. Świeża odpowiedź z innego DID-u nie
  # może pozostawić starej liczby na ekranie jako pozornie aktualnej.
  - platform: template
    id: soot_calculated_available
    internal: true
    on_state:
      then:
        - if:
            condition:
              lambda: return !x;
            then:
              - lvgl.bar.update:
                  id: soot_progress_bar
                  value: 0
              - lvgl.label.update:
                  id: soot_value_label
                  text: "--.- g"

  - platform: template
    id: soot_measured_available
    internal: true
    on_state:
      then:
        - if:
            condition:
              lambda: return !x;
            then:
              - lvgl.label.update:
                  id: soot_measured_label
                  text: "--.- g"

  - platform: template
    id: distance_since_regen_available
    internal: true
    on_state:
      then:
        - if:
            condition:
              lambda: return !x;
            then:
              - lvgl.label.update:
                  id: distance_value_label
                  text: "--- km"

  - platform: template
    id: temp_before_dpf_available
    internal: true
    on_state:
      then:
        - if:
            condition:
              lambda: return !x;
            then:
              - lvgl.bar.update:
                  id: dpf_temp_bar
                  value: 0
              - lvgl.label.update:
                  id: dpf_temp_label
                  text: "-- °C"

  - platform: template
    id: temp_before_turbo_available
    internal: true
    on_state:
      then:
        - if:
            condition:
              lambda: return !x;
            then:
              - lvgl.bar.update:
                  id: turbo_temp_bar
                  value: 0
              - lvgl.label.update:
                  id: turbo_temp_label
                  text: "-- °C"


